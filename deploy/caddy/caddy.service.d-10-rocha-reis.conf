# REFERÊNCIA (Fase 18) — NÃO instalado. Drop-in do caddy.service do pacote oficial do Caddy, instalar como:
#   /etc/systemd/system/caddy.service.d/10-rocha-reis.conf   (depois: systemctl daemon-reload)
#
# Achado no laboratório de rede (tests_infra/fase18_rede.py): o bloco do painel escuta SÓ no IP da VPN
# (bind 10.8.0.1). Se o Caddy sobe antes do wg0, ele não consegue escutar nesse IP e NÃO SOBE INTEIRO —
# derrubando também o webhook público da Meta. Por isso:
#   1) ordem: Caddy depois da VPN;
#   2) Wants= (e não Requires=): uma falha da VPN não pode impedir o webhook. Para o Caddy subir mesmo sem a
#      VPN, o servidor usa net.ipv4.ip_nonlocal_bind=1 (deploy/sysctl/90-rocha-reis.conf), testado no
#      laboratório: com ele o Caddy sobe antes do wg0 (o painel voltar quando a VPN aparece: conferir no servidor).
[Unit]
After=wg-quick@wg0.service
Wants=wg-quick@wg0.service
