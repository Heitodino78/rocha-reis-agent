# Caddy não sobe; com ela, sobe. NÃO testado: o painel voltar a responder quando o wg0 aparece depois
# (comportamento esperado do Linux) — conferir no servidor (GUIA_IMPLANTACAO_SERVIDOR.md §6).
# O acesso continua restrito pelo nftables (10.8.0.0/24 só pelo wg0).
net.ipv4.ip_nonlocal_bind = 1
